<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Processing API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e1e1;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="file"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Results */
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .download-links {
            margin-top: 15px;
        }

        .download-links a {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .download-links a:hover {
            background: #764ba2;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* History */
        .history-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .history-item.trim {
            border-left-color: #28a745;
        }

        .history-item.subtitle {
            border-left-color: #667eea;
        }

        .history-item h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 16px;
        }

        .history-item p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }

        .history-item small {
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎬 Video Processing API</h1>
        <div class="info">
            <strong>API Base URL:</strong> http://localhost:8000 |
            <a href="http://localhost:8000/docs" target="_blank" style="color: #0c5460; text-decoration: underline;">API
                Docs</a>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('trim')">✂️ Trim Video</button>
                <button class="tab" onclick="switchTab('subtitle')">📝 Generate Subtitles</button>
                <button class="tab" onclick="switchTab('history')">📜 History</button>
            </div>

            <!-- Trim Tab -->
            <div id="trim-tab" class="tab-content active">
                <form id="trimForm">
                    <div class="form-group">
                        <label>Select Video File:</label>
                        <input type="file" id="trimVideo" accept="video/*">
                    </div>
                    <div style="text-align: center; margin: 15px 0; color: #666; font-weight: 500;">- OR -</div>
                    <div class="form-group">
                        <label>Enter Full File Path:</label>
                        <input type="text" id="trimPath" placeholder="C://eugene/files/video.mp4">
                        <small style="color: #666; margin-top: 5px; display: block;">Use forward slashes (/)</small>
                    </div>
                    <div class="form-group">
                        <label>Start Time (HH:MM:SS):</label>
                        <input type="text" id="startTime" placeholder="00:00:05" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}"
                            value="00:00:00" required>
                    </div>
                    <div class="form-group">
                        <label>End Time (HH:MM:SS):</label>
                        <input type="text" id="endTime" placeholder="00:00:10" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}"
                            value="00:00:10" required>
                    </div>
                    <button type="submit">Trim Video</button>
                </form>
                <div class="loading" id="trimLoading">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>
                <div class="result" id="trimResult"></div>
            </div>

            <!-- Subtitle Tab -->
            <div id="subtitle-tab" class="tab-content">
                <form id="subtitleForm">
                    <div class="form-group">
                        <label>Select Video File:</label>
                        <input type="file" id="subtitleVideo" accept="video/*">
                    </div>
                    <div style="text-align: center; margin: 15px 0; color: #666; font-weight: 500;">- OR -</div>
                    <div class="form-group">
                        <label>Enter Full File Path:</label>
                        <input type="text" id="subtitlePath" placeholder="C://eugene/files/video.mp4">
                        <small style="color: #666; margin-top: 5px; display: block;">Use forward slashes (/)</small>
                    </div>
                    <div class="form-group">
                        <label>Language:</label>
                        <select id="language">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                            <option value="zh">Chinese</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                        </select>
                    </div>
                    <button type="submit">Generate Subtitles</button>
                </form>
                <div class="loading" id="subtitleLoading">
                    <div class="spinner"></div>
                    <p>Generating subtitles...</p>
                </div>
                <div class="result" id="subtitleResult"></div>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content">
                <button onclick="loadHistory()" style="margin-bottom: 15px;">🔄 Refresh</button>
                <div id="historyContainer" style="max-height: 400px; overflow-y: auto;">
                    <p style="color: #666;">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.add('active');
            event.target.classList.add('active');
        }

        function timeToSeconds(str) {
            const [h, m, s] = str.split(':').map(Number);
            return h * 3600 + m * 60 + s;
        }

        function secondsToTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        window.addEventListener('DOMContentLoaded', loadHistory);

        async function loadHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '<p style="color: #666;">Loading...</p>';
            try {
                const res = await fetch(`${API_URL}/api/history`);
                const data = await res.json();
                const history = data.history || [];
                if (history.length === 0) {
                    container.innerHTML = '<p style="color: #666;">No history yet.</p>';
                    return;
                }
                container.innerHTML = history.map(item => {
                    const date = new Date(item.timestamp).toLocaleString();
                    if (item.type === 'trim') {
                        return `<div class="history-item trim"><h3>✂️ Trim</h3><p><strong>File:</strong> ${item.input_file}</p><p><strong>Time:</strong> ${secondsToTime(item.start_time)} → ${secondsToTime(item.end_time)}</p><small>${date}</small><div class="download-links"><a href="${API_URL}${item.download_url}" download>⬇️ Download</a></div></div>`;
                    }
                    return `<div class="history-item subtitle"><h3>📝 Subtitle</h3><p><strong>File:</strong> ${item.input_file}</p><p><strong>Lang:</strong> ${item.language}</p><small>${date}</small><div class="download-links"><a href="${API_URL}${item.video_download_url}" download>⬇️ Video</a><a href="${API_URL}${item.srt_download_url}" download>📄 SRT</a></div></div>`;
                }).join('');
            } catch (err) {
                container.innerHTML = `<p style="color: #721c24;">Error: ${err.message}</p>`;
            }
        }

        document.getElementById('trimForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const video = document.getElementById('trimVideo').files[0];
            const path = document.getElementById('trimPath').value.trim();
            if (!video && !path) return alert('Select a file or enter path');

            const start = timeToSeconds(document.getElementById('startTime').value);
            const end = timeToSeconds(document.getElementById('endTime').value);
            if (end <= start) return alert('End time must be > start time');

            const fd = new FormData();
            if (video) fd.append('video', video);
            else fd.append('file_path', path);
            fd.append('start_time', start);
            fd.append('end_time', end);

            const loading = document.getElementById('trimLoading');
            const result = document.getElementById('trimResult');
            const btn = e.target.querySelector('button');
            loading.style.display = 'block';
            result.style.display = 'none';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/trim`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    result.className = 'result success';
                    result.innerHTML = `<strong>✅ ${data.message}</strong><div class="download-links"><a href="${API_URL}${data.download_url}" download>⬇️ Download</a></div>`;
                    loadHistory();
                } else throw new Error(data.error || 'Unknown error');
            } catch (err) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Error:</strong> ${err.message}`;
            } finally {
                loading.style.display = 'none';
                result.style.display = 'block';
                btn.disabled = false;
            }
        });

        document.getElementById('subtitleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const video = document.getElementById('subtitleVideo').files[0];
            const path = document.getElementById('subtitlePath').value.trim();
            if (!video && !path) return alert('Select a file or enter path');

            const fd = new FormData();
            if (video) fd.append('video', video);
            else fd.append('file_path', path);
            fd.append('language', document.getElementById('language').value);

            const loading = document.getElementById('subtitleLoading');
            const result = document.getElementById('subtitleResult');
            const btn = e.target.querySelector('button');
            loading.style.display = 'block';
            result.style.display = 'none';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/subtitle`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    result.className = 'result success';
                    result.innerHTML = `<strong>✅ ${data.message}</strong><div class="download-links"><a href="${API_URL}${data.video_download_url}" download>⬇️ Video</a><a href="${API_URL}${data.srt_download_url}" download>📄 SRT</a></div>`;
                    loadHistory();
                } else throw new Error(data.error || 'Unknown error');
            } catch (err) {
                result.className = 'result error';
                result.innerHTML = `<strong>❌ Error:</strong> ${err.message}`;
            } finally {
                loading.style.display = 'none';
                result.style.display = 'block';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
